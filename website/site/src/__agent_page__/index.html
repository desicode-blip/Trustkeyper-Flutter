<!DOCTYPE html>
<html lang="en">
<head>
    
<meta charset="UTF-8">
    
<meta name="viewport" content="width=device-width, initial-scale=1.0">
    
<meta name="description" content="TrustKeyper for {{agent.plural}}: share property links, customers pay {{visitFee}} to book a visit, and you earn from every visit. Available in English, Hindi and Telugu.">
    <title>For {{agent.plural}} — Earn from every visit | TrustKeyper</title>
    
<link rel="icon" type="image/svg+xml" href="/favicon.svg">
    
<link rel="apple-touch-icon" href="/favicon.svg">
    
<link rel="preconnect" href="https://fonts.googleapis.com">
    
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin="">
    
<link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700&amp;display=swap" rel="stylesheet">
    
    
<link rel="stylesheet" crossorigin="" href="/assets/index-D2JZFcds.css">
  
<link rel="canonical" href="https://trustkeyper.com/{{agent.slug}}">
<link rel="stylesheet" href="/website.css">
<link rel="stylesheet" href="/agent.css">
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Devanagari:wght@400;500;600;700&amp;family=Noto+Sans+Telugu:wght@400;500;600;700&amp;display=swap" rel="stylesheet">
<script src="/agent.js" defer></script>
<script id="tk-i18n" type="application/json">{{i18n.agent}}</script>
<script src="/website.js" defer="">
</script>
</head>
  
<body>
    
<div id="root">
<div class="relative isolate flex min-h-screen flex-col bg-marketing-bg"><img decoding="async" alt="" class="pointer-events-none absolute left-1/2 top-0 z-0 h-auto w-screen max-w-none -translate-x-1/2 select-none" draggable="false" aria-hidden="true" src="/assets/hero-nav-ellipse-B1chXbaB.webp">
<header class="fixed inset-x-0 top-0 z-50 px-4 pt-3 sm:px-6 sm:pt-4 lg:px-8">
<div class="mx-auto max-w-[1400px] overflow-hidden rounded-[29px] bg-marketing-bg/55 shadow-lg shadow-marketing-neutral-1100/10 ring-1 ring-marketing-azure-stroke/70 backdrop-blur-xl">
<div class="flex h-[58px] items-center justify-between gap-6 px-4 sm:h-[66px] sm:px-6 lg:px-8"><a href="/" class="shrink-0"><img decoding="async" alt="TrustKeyper" class="h-[30px] w-auto sm:h-10" draggable="false" src="/assets/trustkeyper%20Logo-COTdn5uK.svg"></a>
<nav class="hidden items-center gap-9 lg:flex" aria-label="Audience"><a href="/" class="font-marketing-heading text-[20px] font-medium leading-[26px] text-marketing-neutral-1100 transition-colors hover:text-marketing-blue"><span data-i18n="nav.owners"></span></a><span class="relative font-marketing-subheading text-[20px] font-semibold leading-[26px] text-marketing-neutral-1100"><span data-i18n="nav.agents"></span><span class="absolute -bottom-[7px] left-0 h-0.5 w-full rounded-full bg-marketing-green"></span></span><a href="/for-builders" class="font-marketing-heading text-[20px] font-medium leading-[26px] text-marketing-neutral-1100 transition-colors hover:text-marketing-blue">For Builders</a>
</nav>
<div class="hidden items-center gap-[18px] md:flex"><a href="#get-started" class="inline-flex items-center justify-center rounded-full px-6 py-3 font-roboto text-base font-medium transition-colors border border-marketing-azure-200 bg-transparent text-marketing-neutral-1100 hover:bg-white/70"><span data-i18n="nav.contact"></span></a><a class="inline-flex items-center justify-center rounded-full px-6 py-3 font-roboto text-base font-medium transition-colors bg-marketing-neutral-1100 text-white hover:bg-marketing-neutral-1000" href="https://trustkeyper.web.app/#/login"><span data-i18n="nav.signup"></span></a>
</div>
<button type="button" class="inline-flex h-10 w-10 items-center justify-center rounded-full text-marketing-neutral-1100 transition-colors hover:bg-white/70 md:hidden" aria-expanded="false" aria-label="Open menu" aria-controls="mobile-menu" data-menu-toggle=""><svg xmlns="http://www.w3.org/2000/svg" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="lucide lucide-menu" aria-hidden="true"><path d="M4 5h16"></path><path d="M4 12h16"></path><path d="M4 19h16"></path></svg>
</button>
</div>
<nav id="mobile-menu" hidden="" aria-label="Mobile primary" class="flex flex-col gap-4 border-t border-marketing-azure-stroke px-6 py-5 md:hidden"><a href="/"><span data-i18n="nav.owners"></span></a><a href="/{{agent.slug}}"><span data-i18n="nav.agents"></span></a><a href="/for-builders">For Builders</a><a href="/contact-us"><span data-i18n="nav.contact"></span></a><a href="https://trustkeyper.web.app/#/login" class="inline-flex items-center justify-center rounded-full bg-marketing-neutral-1100 px-6 py-3 text-white"><span data-i18n="nav.signup"></span></a>
</nav>
</div>
</header>
<main class="tka relative z-10 flex flex-1 flex-col pt-[82px] sm:pt-[96px]">

<!-- Language switch -->
<div class="tka-lang-wrap">
  <div class="tka-lang" role="group" aria-label="Language">
    <button type="button" data-lang="en" aria-pressed="true">English</button>
    <button type="button" data-lang="hi" aria-pressed="false" lang="hi">हिंदी</button>
    <button type="button" data-lang="te" aria-pressed="false" lang="te">తెలుగు</button>
  </div>
</div>

<!-- Hero -->
<section class="tka-hero-outer">
  <div class="tka-hero">
    <div class="tka-hero-text">
      <h1 data-i18n="hero.title"></h1>
      <p class="tka-hero-sub" data-i18n="hero.sub"></p>
      <div class="tka-btns">
        <a class="tka-btn tka-btn-green" href="https://trustkeyper.web.app/#/login"><span data-i18n="cta.register"></span><svg class="tka-ico" viewBox="0 0 24 24" aria-hidden="true"><path d="M5 12h14M13 6l6 6-6 6"/></svg></a>
        <a class="tka-btn tka-btn-ghost" href="tel:+918088516875"><svg class="tka-ico" viewBox="0 0 24 24" aria-hidden="true"><path d="M22 16.9v3a2 2 0 0 1-2.2 2 19.8 19.8 0 0 1-8.6-3.1 19.5 19.5 0 0 1-6-6A19.8 19.8 0 0 1 2.1 4.2 2 2 0 0 1 4.1 2h3a2 2 0 0 1 2 1.7c.1 1 .4 1.9.7 2.8a2 2 0 0 1-.5 2.1L8 9.9a16 16 0 0 0 6 6l1.3-1.3a2 2 0 0 1 2.1-.4c.9.3 1.8.6 2.8.7a2 2 0 0 1 1.7 2z"/></svg><span data-i18n="cta.call"></span></a>
      </div>
      <p class="tka-note" data-i18n="hero.note"></p>
    </div>

    <div class="tka-hero-visual" aria-hidden="true">
      <div class="tka-phone">
        <div class="tka-screen">
          <div class="tka-app-top"><img src="/assets/trustkeyper Logo-COTdn5uK.svg" alt="" class="tka-app-logo"><span class="tka-bell"></span></div>
          <div class="tka-earn">
            <span data-i18n="mock.today"></span>
            <strong>₹400</strong>
            <small data-i18n="mock.visits"></small>
          </div>
          <div class="tka-card tka-card-hl">
            <div class="tka-row"><span class="tka-check">✓</span><b data-i18n="mock.booked"></b></div>
            <p data-i18n="mock.customer"></p>
            <p data-i18n="mock.flat"></p>
            <p data-i18n="mock.time"></p>
          </div>
          <div class="tka-card"><div class="tka-row"><span class="tka-check">✓</span><b data-i18n="mock.booked"></b></div><p data-i18n="list.p2"></p></div>
          <div class="tka-card"><div class="tka-row"><span class="tka-check">✓</span><b data-i18n="mock.booked"></b></div><p data-i18n="list.p3"></p></div>
        </div>
      </div>
      <div class="tka-toast"><span class="tka-coin">₹</span><span data-i18n="mock.paid"></span></div>
    </div>
  </div>
</section>

<!-- Problem vs new way -->
<section class="tka-sec tka-bg-cloud">
  <div class="tka-wrap">
    <p class="tka-eyebrow" data-i18n="problem.eyebrow"></p>
    <h2 data-i18n="problem.title"></h2>
    <div class="tka-compare">
      <div class="tka-cmp tka-cmp-old">
        <h3><span class="tka-badge tka-badge-red">✕</span><span data-i18n="old.title"></span></h3>
        <div class="tka-houses" aria-hidden="true"><i class="on"></i><i></i><i></i><i></i><i></i><i></i><i></i><i></i><i></i><i></i></div>
        <ul><li data-i18n="old.l1"></li><li data-i18n="old.l2"></li><li data-i18n="old.l3"></li></ul>
        <p class="tka-result" data-i18n="old.result"></p>
      </div>
      <div class="tka-cmp tka-cmp-new">
        <h3><span class="tka-badge tka-badge-green">✓</span><span data-i18n="new.title"></span></h3>
        <div class="tka-houses all" aria-hidden="true"><i class="on"></i><i class="on"></i><i class="on"></i><i class="on"></i><i class="on"></i><i class="on"></i><i class="on"></i><i class="on"></i><i class="on"></i><i class="on"></i></div>
        <ul><li data-i18n="new.l1"></li><li data-i18n="new.l2"></li><li data-i18n="new.l3"></li></ul>
        <p class="tka-result" data-i18n="new.result"></p>
      </div>
    </div>
  </div>
</section>

<!-- How it works -->
<section class="tka-sec">
  <div class="tka-wrap tka-split">
    <div>
      <p class="tka-eyebrow" data-i18n="how.eyebrow"></p>
      <h2 data-i18n="how.title"></h2>
      <ol class="tka-steps">
        <li><span class="tka-num">1</span><div><h3 data-i18n="s1.t"></h3><p data-i18n="s1.d"></p></div><svg class="tka-ico tka-step-ico" viewBox="0 0 24 24" aria-hidden="true"><path d="M3 10.5 12 3l9 7.5V21H3z"/><path d="M12 11v6M9 14h6"/></svg></li>
        <li><span class="tka-num">2</span><div><h3 data-i18n="s2.t"></h3><p data-i18n="s2.d"></p></div><svg class="tka-ico tka-step-ico" viewBox="0 0 24 24" aria-hidden="true"><path d="M10 14a5 5 0 0 0 7 0l3-3a5 5 0 0 0-7-7l-1 1"/><path d="M14 10a5 5 0 0 0-7 0l-3 3a5 5 0 0 0 7 7l1-1"/></svg></li>
        <li><span class="tka-num">3</span><div><h3 data-i18n="s3.t"></h3><p data-i18n="s3.d"></p></div><svg class="tka-ico tka-step-ico" viewBox="0 0 24 24" aria-hidden="true"><path d="M2 12s3.5-7 10-7 10 7 10 7-3.5 7-10 7S2 12 2 12z"/><circle cx="12" cy="12" r="3"/></svg></li>
        <li class="tka-step-money"><span class="tka-num">4</span><div><h3 data-i18n="s4.t"></h3><p data-i18n="s4.d"></p></div><span class="tka-coin tka-step-ico">₹</span></li>
      </ol>
    </div>
    <div class="tka-visual-col" aria-hidden="true">
      <div class="tka-phone">
        <div class="tka-screen tka-screen-link">
          <div class="tka-photo"><span class="tka-photo-count" data-i18n="link.photos"></span></div>
          <div class="tka-link-body">
            <h4 data-i18n="link.flat"></h4>
            <p class="tka-muted">📍 <span data-i18n="link.area"></span></p>
            <p class="tka-rent" data-i18n="link.rent"></p>
            <div class="tka-chips"><span>2 Bed</span><span>2 Bath</span><span>1150 sqft</span></div>
            <p class="tka-muted tka-small" data-i18n="link.shared"></p>
            <div class="tka-book" data-i18n="link.book"></div>
          </div>
        </div>
      </div>
      <div class="tka-wa"><span class="tka-wa-dot"></span>trustkeyper.com/p/2bhk-gachibowli</div>
    </div>
  </div>
</section>

<!-- More tools -->
<section class="tka-sec tka-bg-cloud">
  <div class="tka-wrap">
    <p class="tka-eyebrow" data-i18n="tools.eyebrow"></p>
    <h2 data-i18n="tools.title"></h2>
    <div class="tka-tools">
      <div class="tka-tool">
        <div class="tka-phone tka-phone-sm" aria-hidden="true">
          <div class="tka-screen">
            <div class="tka-screen-head"><b data-i18n="list.title"></b><small data-i18n="list.count"></small></div>
            <div class="tka-prop"><span class="tka-thumb t1"></span><div><b data-i18n="list.p1"></b><span class="tka-ok" data-i18n="list.done"></span></div></div>
            <div class="tka-prop"><span class="tka-thumb t2"></span><div><b data-i18n="list.p2"></b><span class="tka-ok" data-i18n="list.done"></span></div></div>
            <div class="tka-prop"><span class="tka-thumb t3"></span><div><b data-i18n="list.p3"></b><span class="tka-wait" data-i18n="list.pending"></span></div></div>
            <div class="tka-fab">+</div>
          </div>
        </div>
        <h3 data-i18n="t1.t"></h3><p data-i18n="t1.d"></p>
      </div>
      <div class="tka-tool">
        <div class="tka-phone tka-phone-sm" aria-hidden="true">
          <div class="tka-screen">
            <div class="tka-screen-head"><b data-i18n="agr.title"></b></div>
            <label class="tka-field"><span data-i18n="agr.owner"></span><i>Suresh Reddy</i></label>
            <label class="tka-field"><span data-i18n="agr.tenant"></span><i>Ravi Kumar</i></label>
            <label class="tka-field"><span data-i18n="agr.rent"></span><i>₹28,000</i></label>
            <div class="tka-doc"><span></span><span></span><span class="short"></span></div>
            <div class="tka-book" data-i18n="agr.create"></div>
          </div>
        </div>
        <h3 data-i18n="t2.t"></h3><p data-i18n="t2.d"></p>
      </div>
      <div class="tka-tool tka-tool-help">
        <div class="tka-help-ico" aria-hidden="true"><svg class="tka-ico" viewBox="0 0 24 24"><path d="M22 16.9v3a2 2 0 0 1-2.2 2 19.8 19.8 0 0 1-8.6-3.1 19.5 19.5 0 0 1-6-6A19.8 19.8 0 0 1 2.1 4.2 2 2 0 0 1 4.1 2h3a2 2 0 0 1 2 1.7c.1 1 .4 1.9.7 2.8a2 2 0 0 1-.5 2.1L8 9.9a16 16 0 0 0 6 6l1.3-1.3a2 2 0 0 1 2.1-.4c.9.3 1.8.6 2.8.7a2 2 0 0 1 1.7 2z"/></svg></div>
        <h3 data-i18n="t3.t"></h3><p data-i18n="t3.d"></p>
        <a class="tka-btn tka-btn-dark" href="tel:+918088516875">+91 8088516875</a>
      </div>
    </div>
  </div>
</section>

<!-- Pace banner -->
<section class="tka-pace-outer">
  <div class="tka-pace">
    <div class="tka-speed" aria-hidden="true"><i></i><i></i><i></i></div>
    <h2 data-i18n="pace.title"></h2>
    <p data-i18n="pace.sub"></p>
    <a class="tka-btn tka-btn-green" href="https://trustkeyper.web.app/#/login"><span data-i18n="cta.register"></span><svg class="tka-ico" viewBox="0 0 24 24" aria-hidden="true"><path d="M5 12h14M13 6l6 6-6 6"/></svg></a>
  </div>
</section>

<!-- FAQ -->
<section class="tka-sec">
  <div class="tka-wrap tka-faq-wrap">
    <p class="tka-eyebrow" data-i18n="faq.eyebrow"></p>
    <h2 data-i18n="faq.title"></h2>
    <div class="tka-faq">
      {{faq}}
    </div>
  </div>
</section>

<!-- Final CTA -->
<section class="tka-final">
  <div class="tka-wrap">
    <h2 data-i18n="final.title"></h2>
    <p data-i18n="final.sub"></p>
    <div class="tka-btns tka-btns-center">
      <a class="tka-btn tka-btn-green" href="https://trustkeyper.web.app/#/login"><span data-i18n="cta.register"></span><svg class="tka-ico" viewBox="0 0 24 24" aria-hidden="true"><path d="M5 12h14M13 6l6 6-6 6"/></svg></a>
      <a class="tka-btn tka-btn-ghost-light" href="tel:+918088516875"><svg class="tka-ico" viewBox="0 0 24 24" aria-hidden="true"><path d="M22 16.9v3a2 2 0 0 1-2.2 2 19.8 19.8 0 0 1-8.6-3.1 19.5 19.5 0 0 1-6-6A19.8 19.8 0 0 1 2.1 4.2 2 2 0 0 1 4.1 2h3a2 2 0 0 1 2 1.7c.1 1 .4 1.9.7 2.8a2 2 0 0 1-.5 2.1L8 9.9a16 16 0 0 0 6 6l1.3-1.3a2 2 0 0 1 2.1-.4c.9.3 1.8.6 2.8.7a2 2 0 0 1 1.7 2z"/></svg><span data-i18n="cta.call"></span></a>
    </div>
  </div>
</section>

{{> footer}}
</main>

</div>
</div>
  


<div id="codex-agent-overlay-root">
</div><noscript>
<p class="p-4">Sign Up/Login opens the TrustKeyper app. To contact us, email <a href="mailto:info@trustkeyper.com">info@trustkeyper.com</a> or call <a href="tel:+918088516875">+91 8088516875</a>.
</p></noscript>
</body></html>
