<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>TrustKeeper</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700;800&display=swap" rel="stylesheet">
<style>
:root{--p:#3160FF;--pd:#1F4AD1;--ps:#EAF0FF;--pb:#DCE5F6;--ok:#146C3E;--oks:#E7F8EF;--bd:#DCE2E9;--h:#172231;--b:#2B3A4D;--m:#5E7087;--e:#B3261E;--es:#FDECEA;--sm:#F6F9FD;--w:#8A4500;--ws:#FFF3E0}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:#EEF2F7;font-family:Roboto,system-ui,sans-serif;color:var(--b)}
#app{max-width:480px;margin:0 auto;min-height:100vh;background:#fff;position:relative;overflow:hidden}
.screen{min-height:100vh;display:flex;flex-direction:column;animation:in .28s cubic-bezier(.2,.8,.2,1)}
.screen.back{animation:back .28s cubic-bezier(.2,.8,.2,1)}
@keyframes in{from{transform:translateX(18%);opacity:0}to{transform:none;opacity:1}}
@keyframes back{from{transform:translateX(-18%);opacity:0}to{transform:none;opacity:1}}
.hd{position:sticky;top:0;z-index:5;background:#fff;padding:calc(14px + env(safe-area-inset-top)) 22px 12px;box-shadow:0 6px 10px -8px rgba(16,24,40,.25)}
.hdr{display:flex;align-items:center;gap:12px}
.bk{width:46px;height:46px;border-radius:50%;border:1px solid var(--bd);background:#fff;display:grid;place-items:center;cursor:pointer;flex:none;box-shadow:0 2px 6px rgba(16,24,40,.08)}
.hd h1{margin:0;font-size:24px;line-height:30px;font-weight:700;color:var(--h)}
.sub{margin:6px 0 0;font-size:15px;color:var(--m)}
.bd{padding:26px 22px 28px;flex:1}
.brand{font-weight:800;color:var(--pd);font-size:20px;letter-spacing:.2px}
.btn{display:flex;align-items:center;justify-content:center;gap:8px;width:100%;height:56px;border-radius:28px;border:0;background:var(--p);color:#fff;font:600 17px Roboto,sans-serif;cursor:pointer;margin-top:24px}
.btn:active{transform:scale(.98)}
.btn.out{background:#fff;color:var(--pd);border:1.5px solid var(--bd)}
.btn.ghost{background:none;color:var(--m);height:44px;margin-top:6px}
.btn.green{background:var(--ok)}
.fld{position:relative;margin:14px 0 0}
.fld input,.fld select,.fld textarea{width:100%;height:60px;border:1.4px solid var(--bd);border-radius:16px;padding:22px 16px 8px;font:17px Roboto,sans-serif;color:var(--h);background:#fff;outline:none;appearance:none}
.fld textarea{height:84px;resize:none}
.fld label{position:absolute;left:17px;top:19px;font-size:17px;color:var(--m);pointer-events:none;transition:.15s}
.fld input:focus,.fld select:focus,.fld textarea:focus{border-color:var(--p)}
.fld input:focus+label,.fld input:not(:placeholder-shown)+label,.fld select+label,.fld textarea:focus+label,.fld textarea:not(:placeholder-shown)+label{top:7px;font-size:12.5px;color:var(--pd)}
.fld.pre input{padding-left:44px}.fld .px{position:absolute;left:17px;top:23px;color:var(--m);font-size:17px}
.fld.bad input,.fld.bad select,.fld.bad textarea{border-color:var(--e);border-width:1.8px}
.need{color:var(--e);font-size:14px;margin:6px 4px 0}
.att{border-radius:18px;transition:.2s}
.att.bad{background:var(--es);border:1.5px solid var(--e);padding:12px}
.lbl{font-weight:600;font-size:16px;color:var(--h);margin:22px 0 10px}
.muted{color:var(--m);font-size:14.5px;line-height:21px}
.row{display:flex;gap:12px}.row>*{flex:1}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{padding:11px 16px;border-radius:14px;border:1.4px solid var(--bd);background:#fff;font:500 15.5px Roboto;color:var(--b);cursor:pointer}
.chip.on{background:var(--p);border-color:var(--p);color:#fff}
.chip:disabled{opacity:.35;cursor:default}
.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.tile{height:58px;border-radius:16px;background:var(--sm);border:1.4px solid transparent;font:500 16px Roboto;color:var(--h);cursor:pointer}
.tile.on{background:var(--p);color:#fff}
.cb{display:flex;align-items:center;gap:12px;padding:10px 2px;font-size:16.5px;color:var(--h);cursor:pointer}
.cb i{width:24px;height:24px;border-radius:7px;border:2px solid var(--m);display:grid;place-items:center;font-style:normal;color:#fff;font-size:15px}
.cb.on i{background:var(--p);border-color:var(--p)}
.card{border-radius:20px;background:#fff;box-shadow:0 8px 22px rgba(23,34,49,.08)}
.ticket{display:flex;overflow:hidden}
.tl{background:var(--ps);padding:18px 14px;min-width:118px;display:flex;flex-direction:column;justify-content:center;align-items:center;border-right:2px dashed #C9D6F5;text-align:center}
.tl b{font-size:26px;color:var(--pd);font-weight:800;line-height:30px}
.tl span{font-size:17px;color:var(--pd);font-weight:700;margin-top:8px}
.tl small{font-size:12.5px;color:var(--pd)}
.tr{padding:14px 14px;flex:1;min-width:0}
.tr h3{margin:0;font-size:17px;color:var(--h)}
.tr .ad{font-size:13.5px;color:var(--m);margin:4px 0 8px;display:flex;gap:4px}
.facts{display:grid;grid-template-columns:1fr 1fr;gap:6px 10px;font-size:13.5px;color:var(--m)}
.list{margin-top:12px}
.li{display:flex;align-items:center;gap:12px;padding:12px 14px;border-bottom:1px solid #EEF2F7}
.li:last-child{border:0}
.ic{width:34px;height:34px;border-radius:10px;background:var(--ps);display:grid;place-items:center;flex:none}
.li .k{color:var(--b);font-size:15px}.li .v{margin-left:auto;font-weight:600;color:var(--h);font-size:15px;text-align:right}
.note{background:var(--ps);color:var(--pd);border-radius:18px;padding:16px;display:flex;gap:12px;font-size:15px;line-height:21px;margin-top:18px}
.steps{background:var(--sm);border-radius:18px;padding:16px;margin-top:16px}
.st{display:flex;gap:12px;margin:10px 0 0}
.dot{width:26px;height:26px;border-radius:50%;background:var(--ps);color:var(--pd);display:grid;place-items:center;font-weight:700;font-size:13px;flex:none}
.st.done .dot{background:var(--ok);color:#fff}.st.now .dot{background:var(--p);color:#fff}
.st b{display:block;color:var(--h);font-size:15px}.st small{color:var(--m);font-size:13.5px}
.photo{height:220px;border-radius:22px;background:var(--ps);display:grid;place-items:center;overflow:hidden}
.days{display:flex;gap:10px;overflow-x:auto;padding-bottom:4px}
.day{min-width:66px;height:76px;border-radius:16px;border:1.5px solid var(--bd);background:#fff;display:flex;flex-direction:column;align-items:center;justify-content:center;cursor:pointer;font:500 14px Roboto;color:var(--m)}
.day b{font-size:22px;color:var(--h)}
.day.on{background:var(--p);border-color:var(--p);color:#fff}.day.on b{color:#fff}
.day:disabled{opacity:.35}
.otp{display:flex;gap:10px;justify-content:center;margin-top:16px}
.otp input{width:54px;height:62px;text-align:center;font-size:26px;font-weight:700;border:1.5px solid var(--bd);border-radius:14px;outline:none}
.otp input:focus{border-color:var(--p)}
.demo{background:var(--ws);color:var(--w);border-radius:12px;padding:10px 12px;font-size:13.5px;margin-top:12px}
.code{background:var(--ps);border-radius:20px;padding:20px;text-align:center;color:var(--pd);margin-top:24px}
.code b{display:block;font-size:38px;letter-spacing:8px;margin:6px 0}
.ok{width:84px;height:84px;border-radius:50%;background:var(--oks);display:grid;place-items:center;margin:20px auto 0;animation:pop .4s ease}
@keyframes pop{from{transform:scale(.4);opacity:0}to{transform:none;opacity:1}}
.center{text-align:center}
.big{font-size:26px;font-weight:700;color:var(--h);margin:16px 0 6px}
.sum{border:1px solid var(--bd);border-radius:18px;padding:6px 16px;margin-top:18px}
.sum div{display:flex;justify-content:padding;padding:10px 0;border-bottom:1px solid #EEF2F7;justify-content:space-between}
.sum div:last-child{border:0;font-weight:700;color:var(--h)}
.prog{height:5px;background:var(--pb);border-radius:3px;margin-top:12px;overflow:hidden}
.prog i{display:block;height:100%;background:var(--p);transition:width .3s}
.up{border:1.5px dashed var(--pb);background:var(--sm);border-radius:18px;padding:18px;text-align:center;color:var(--pd);font-weight:600;cursor:pointer;display:block;margin-top:12px}
.up input{display:none}
.thumbs{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}
.thumbs img{width:76px;height:76px;object-fit:cover;border-radius:12px}
.toggle{display:flex;background:var(--sm);border-radius:14px;padding:4px;gap:4px;margin-top:6px}
.toggle button{flex:1;height:44px;border:0;border-radius:11px;background:none;font:600 15px Roboto;color:var(--m);cursor:pointer}
.toggle button.on{background:#fff;color:var(--pd);box-shadow:0 2px 6px rgba(16,24,40,.1)}
.agr{background:var(--sm);border-radius:16px;padding:16px;font-size:14px;line-height:21px;color:var(--b);margin-top:14px}
.tag{display:inline-block;padding:5px 10px;border-radius:10px;font-size:13px;font-weight:600}
.tag.ok{background:var(--oks);color:var(--ok)}.tag.wait{background:var(--ws);color:var(--w)}
svg.i{width:18px;height:18px;stroke:var(--pd);fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
</style>
</head>
<body>
<div id="app"></div>
<script>
'use strict';
const $app = document.getElementById('app');
const money = n => '₹' + Math.round(n).toLocaleString('en-IN');
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const store = { get(k, d) { try { const v = localStorage.getItem('tk-' + k); return v ? JSON.parse(v) : d; } catch { return d; } }, set(k, v) { try { localStorage.setItem('tk-' + k, JSON.stringify(v)); } catch {} } };
const ICON = {
  pin:'<path d="M12 21s-6-5.3-6-10a6 6 0 0 1 12 0c0 4.7-6 10-6 10z"/><circle cx="12" cy="11" r="2"/>',
  rupee:'<path d="M7 5h10M7 9h10M10 5c4 0 4 8 0 8H7l7 6"/>',
  size:'<path d="M4 20V4l16 16z"/><path d="M8 16h2"/>',
  sofa:'<path d="M5 11V8a2 2 0 0 1 2-2h10a2 2 0 0 1 2 2v3"/><path d="M3 13a2 2 0 0 1 4 0v2h10v-2a2 2 0 0 1 4 0v4H3z"/>',
  people:'<circle cx="9" cy="8" r="3"/><path d="M3 20a6 6 0 0 1 12 0"/><circle cx="17" cy="9" r="2"/><path d="M17 14a4 4 0 0 1 4 4"/>',
  paw:'<ellipse cx="5" cy="10" rx="1.6" ry="2"/><ellipse cx="9" cy="6" rx="1.7" ry="2.2"/><ellipse cx="15" cy="6" rx="1.7" ry="2.2"/><ellipse cx="19" cy="10" rx="1.6" ry="2"/><path d="M12 11.5c-2 0-3.4 2-4.4 3.5-.9 1.4-2.4 2-2.4 3.5 0 1.3 1 2.1 2.3 2.1 1.5 0 2.6-.6 4.5-.6s3 .6 4.5.6c1.3 0 2.3-.8 2.3-2.1 0-1.5-1.5-2.1-2.4-3.5-1-1.5-2.4-3.5-4.4-3.5z"/>',
  cal:'<rect x="4" y="5" width="16" height="16" rx="2"/><path d="M16 3v4M8 3v4M4 11h16"/>',
  layers:'<path d="M12 3l9 5-9 5-9-5z"/><path d="M3 13l9 5 9-5"/>',
  compass:'<circle cx="12" cy="12" r="9"/><path d="M15 9l-2 5-5 2 2-5z"/>',
  hand:'<path d="M7 11l4-4 3 3 3-3 4 4-7 7z"/><path d="M3 11l4 0"/>',
  ticket:'<path d="M4 7h16v4a2 2 0 0 0 0 4v4H4v-4a2 2 0 0 0 0-4z"/>',
  shield:'<path d="M12 3l7 3v5c0 5-3 8-7 10-4-2-7-5-7-10V6z"/><path d="M9 12l2 2 4-4"/>',
  back:'<path d="M15 6l-6 6 6 6"/>', check:'<path d="M5 12l5 5 9-10"/>', lock:'<rect x="5" y="11" width="14" height="10" rx="2"/><path d="M8 11V7a4 4 0 0 1 8 0v4"/>'
};
const ic = (n, c = '') => `<svg class="i" viewBox="0 0 24 24" ${c ? `style="stroke:${c}"` : ''}>${ICON[n]}</svg>`;
const HOUSE = '<svg viewBox="0 0 200 140" width="200"><rect x="40" y="58" width="120" height="70" rx="6" fill="#fff" stroke="#3160FF" stroke-width="3"/><path d="M30 64l70-46 70 46" fill="none" stroke="#3160FF" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/><rect x="88" y="92" width="24" height="36" rx="3" fill="#EAF0FF" stroke="#3160FF" stroke-width="3"/><rect x="54" y="76" width="22" height="18" rx="3" fill="#EAF0FF" stroke="#3160FF" stroke-width="3"/><rect x="124" y="76" width="22" height="18" rx="3" fill="#EAF0FF" stroke="#3160FF" stroke-width="3"/></svg>';

/* ---------- links: #p-<base32 json> (property) · #owner-<base32 json> (owner invite) ---------- */
const B32 = 'abcdefghijklmnopqrstuvwxyz234567';
function b32decode(s) { let bits = 0, val = 0; const out = []; for (const ch of s) { const i = B32.indexOf(ch); if (i < 0) continue; val = (val << 5) | i; bits += 5; if (bits >= 8) { out.push((val >> (bits - 8)) & 255); bits -= 8; } } return new TextDecoder().decode(new Uint8Array(out)); }
function b32encode(str) { const bytes = new TextEncoder().encode(str); let bits = 0, val = 0, out = ''; for (const b of bytes) { val = (val << 8) | b; bits += 8; while (bits >= 5) { out += B32[(val >> (bits - 5)) & 31]; bits -= 5; } } if (bits > 0) out += B32[(val << (5 - bits)) & 31]; return out; }
const SAMPLE = { id: 'sample', t: 'Sri Sai Residency', a: 'Madhapur, Hyderabad', r: '2 BHK', rent: 32000, mi: 1, m: 0, d: 64000, b: 32000, bd: 30, f: 'Semi-furnished', s: 1150, fl: 3, tf: 6, fc: 'East', w: 'Anyone', pt: 1, av: '', vd: 'all', vf: 9, vt: 20, fee: 150, bn: 'Suresh Kumar' };
function readHash() {
  const h = location.hash.slice(1);
  try {
    if (h.startsWith('p-')) return { kind: 'tenant', p: { ...SAMPLE, ...JSON.parse(b32decode(h.slice(2))) } };
    if (h.startsWith('owner')) return { kind: 'owner', inv: h.length > 6 ? JSON.parse(b32decode(h.slice(6))) : { bn: 'Your broker' } };
  } catch {}
  if (h === 'sample') return { kind: 'tenant', p: SAMPLE };
  return { kind: 'home' };
}

/* ---------- tiny screen engine: each screen slides in; Back goes one screen back ---------- */
let stack = [];
function go(fn, ...args) { stack.push([fn, args]); draw(false); }
function back() { if (stack.length > 1) { stack.pop(); draw(true); } }
function replace(fn, ...args) { stack[stack.length - 1] = [fn, args]; draw(false); }
function redraw() { const [fn, args] = stack[stack.length - 1]; $app.innerHTML = fn(...args); bind(); }
function draw(isBack) { const [fn, args] = stack[stack.length - 1]; $app.innerHTML = fn(...args); const s = $app.firstElementChild; if (s && isBack) s.classList.add('back'); window.scrollTo(0, 0); bind(); }
let handlers = {};
let hid = 0;
const on = f => { const k = 'h' + (hid++); handlers[k] = f; return k; };
function bind() { $app.querySelectorAll('[data-on]').forEach(el => { const f = handlers[el.dataset.on]; const ev = el.dataset.ev || 'click'; el.addEventListener(ev, e => f(e, el)); }); }
const screen = (title, sub, body, { noBack, top } = {}) => `<div class="screen"><div class="hd">${top || ''}<div class="hdr">${noBack || stack.length < 2 ? '' : `<button class="bk" data-on="${on(back)}" aria-label="Back">${ic('back', '#172231')}</button>`}<h1>${title}</h1></div>${sub ? `<p class="sub">${sub}</p>` : ''}</div><div class="bd">${body}</div></div>`;
const field = (id, label, val = '', { type = 'text', bad, pre, need, area } = {}) => `<div class="fld ${pre ? 'pre' : ''} ${bad ? 'bad' : ''}">${pre ? `<span class="px">${pre}</span>` : ''}${area ? `<textarea id="${id}" placeholder=" ">${esc(val)}</textarea>` : `<input id="${id}" type="${type}" ${type === 'tel' || type === 'number' ? 'inputmode="numeric"' : ''} placeholder=" " value="${esc(val)}">`}<label for="${id}">${label}</label></div>${bad && need ? `<p class="need">${need}</p>` : ''}`;
const val = id => (document.getElementById(id)?.value || '').trim();
const num = id => parseInt(val(id).replace(/\D/g, '') || '0', 10);
const hour = h => (h % 12 || 12) + ':00 ' + (h < 12 ? 'am' : 'pm');
const DAYNAMES = ['Sun', 'Mon', 'Tue', 'Wed', 'Thu', 'Fri', 'Sat'];
const dayOpen = (p, d) => { const we = d.getDay() === 0 || d.getDay() === 6; return p.vd === 'weekdays' ? !we : p.vd === 'weekends' ? we : true; };

/* ---------- shared sign-up: name + phone (or email for owners) + OTP (demo) ---------- */
function signup(role, done) {
  const st = { mode: 'phone', sent: false, bad: {} };
  const view = () => screen(st.sent ? 'Enter the code' : 'Sign up', st.sent ? `We sent a 4 digit code to ${esc(st.contact)}.` : role === 'owner' ? 'Your name and how we reach you.' : 'Your name and phone, to book the visit.', st.sent ? `
      <div class="otp">${[0,1,2,3].map(i => `<input id="o${i}" inputmode="numeric" maxlength="1" data-ev="input" data-on="${on(otpType)}">`).join('')}</div>
      ${st.bad.otp ? '<p class="need center">That code is not right. Try again.</p>' : ''}
      <div class="demo">Demo: the code is <b>1234</b>. Real SMS/WhatsApp OTP comes later.</div>
      <button class="btn" data-on="${on(verify)}">Verify</button>
      <button class="btn ghost" data-on="${on(() => { st.sent = false; redraw(); })}">Change ${st.mode === 'email' ? 'email' : 'number'}</button>` : `
      ${field('nm', 'Full name', st.name, { bad: st.bad.nm, need: 'Type your name' })}
      ${role === 'owner' ? `<div class="toggle"><button class="${st.mode === 'phone' ? 'on' : ''}" data-on="${on(() => { keep(); st.mode = 'phone'; redraw(); })}">Phone</button><button class="${st.mode === 'email' ? 'on' : ''}" data-on="${on(() => { keep(); st.mode = 'email'; redraw(); })}">Email</button></div>` : ''}
      ${st.mode === 'phone' ? field('ct', 'Mobile number', st.contact, { type: 'tel', pre: '+91', bad: st.bad.ct, need: 'Type a 10 digit mobile number' }) : field('ct', 'Email address', st.contact, { type: 'email', bad: st.bad.ct, need: 'Type a valid email' })}
      <p class="muted" style="margin-top:12px">We send a one-time code to check it is you.</p>
      <button class="btn" data-on="${on(send)}">Send code</button>`);
  function keep() { st.name = val('nm'); }
  function send() {
    st.name = val('nm'); st.contact = val('ct');
    st.bad = { nm: st.name.length < 2, ct: st.mode === 'phone' ? !/^[6-9]\d{9}$/.test(st.contact.replace(/\D/g, '')) : !/^[^@\s]+@[^@\s]+\.[^@\s]{2,}$/.test(st.contact) };
    if (st.bad.nm || st.bad.ct) return redraw();
    if (st.mode === 'phone') st.contact = '+91 ' + st.contact.replace(/\D/g, '');
    st.sent = true; redraw(); setTimeout(() => document.getElementById('o0')?.focus(), 50);
  }
  function otpType(e, el) { const i = +el.id.slice(1); if (el.value && i < 3) document.getElementById('o' + (i + 1)).focus(); if ([0,1,2,3].every(k => val('o' + k))) verify(); }
  function verify() { const code = [0,1,2,3].map(k => val('o' + k)).join(''); if (code !== '1234') { st.bad = { otp: true }; return redraw(); } const user = { name: st.name, contact: st.contact }; store.set(role + '-user', user); done(user); }
  return view;
}
function withScreenState(viewFn) { return viewFn(); }
const live = f => () => f();

/* ================= TENANT ================= */
let P = null; // property shown
const T = () => store.get('trip-' + P.id, null);
const setT = v => store.set('trip-' + P.id, v);

function propertyView() {
  const p = P;
  const facts = [
    ['rupee', 'Rent', money(p.rent) + ' / month'],
    ['rupee', 'Maintenance', p.mi || !p.m ? 'Included' : money(p.m) + ' / month'],
    ...(p.d ? [['lock', 'Security deposit', money(p.d)]] : []),
    ['hand', 'Brokerage', !p.b ? 'No brokerage' : p.bd === 15 ? '15 days rent · ' + money(p.b) : p.bd === 30 ? '1 month rent · ' + money(p.b) : money(p.b)],
    ['ticket', 'Visit fee', p.fee ? money(p.fee) : 'Free'],
    ...(p.s ? [['size', 'Size', p.s + ' sft']] : []),
    ['sofa', 'Furnishing', p.f],
    ...(p.tf ? [['layers', 'Floor', p.fl + ' of ' + p.tf]] : []),
    ...(p.fc ? [['compass', 'Facing', p.fc]] : []),
    ['people', 'Who can rent', p.w === 'Anyone' ? 'Anyone can rent' : p.w],
    ['paw', 'Pets', p.pt ? 'Allowed' : 'Not allowed'],
    ['cal', 'Available', p.av ? new Date(p.av).toLocaleDateString('en-IN', { day: 'numeric', month: 'short', year: 'numeric' }) : 'Now'],
  ];
  const t = T();
  return `<div class="screen"><div class="hd"><div class="hdr" style="justify-content:center"><span class="brand">TrustKeeper</span></div></div><div class="bd" style="padding-top:18px">
    <div class="photo">${HOUSE}</div>
    <div class="card ticket" style="margin-top:16px"><div class="tl"><b>${esc(p.r)}</b><span>${money(p.rent)}</span><small>${p.mi || !p.m ? 'incl. maint.' : '+ ' + money(p.m) + ' maint.'}</small></div>

  { k: 'aad', t: 'Aadhaar card', s: a => a.owners > 1 ? `Of every owner (${a.owners}).` : 'Front and back.', v: a => `<div class="att ${a.bad ? 'bad' : ''}"><label class="up">${a.aad ? '✓ Added · change' : '+ Upload Aadhaar'}<input type="file" accept="image/*,.pdf" multiple data-ev="change" data-on="${on(() => { a.aad = 1; a.bad = 0; oSave(); })}"></label>${a.bad ? '<p class="need">Add the Aadhaar</p>' : ''}</div>`, ok: a => !!a.aad },
  { k: 'ten', t: 'Has anyone rented it before?', s: 'If yes, add the old or current rent agreement.', v: a => `<div class="chips">${[['no', 'No'], ['yes', 'Yes']].map(([k, x]) => `<button class="chip ${a.ten === k ? 'on' : ''}" data-on="${on(() => { a.ten = k; oSave(); })}">${x}</button>`).join('')}</div>${a.ten === 'yes' ? `<label class="up">${a.tenDoc ? '✓ Added · change' : '+ Upload the agreement'}<input type="file" accept="image/*,.pdf" data-ev="change" data-on="${on(() => { a.tenDoc = 1; oSave(); })}"></label>` : ''}`, skip: true },
  { k: 'bank', t: 'Bank for the rent', s: 'A cancelled cheque is best. Rent goes here every month.', v: a => `<div class="att ${a.bad ? 'bad' : ''}"><label class="up">${a.bank ? '✓ Added · change' : '+ Upload cancelled cheque'}<input type="file" accept="image/*,.pdf" data-ev="change" data-on="${on(() => { a.bank = 1; a.bad = 0; oSave(); })}"></label>${a.bad ? '<p class="need">Add the cheque</p>' : ''}</div>`, ok: a => !!a.bank },
  { k: 'keys', t: 'Who has the keys?', v: a => `<div class="att ${a.bad && !a.keys ? 'bad' : ''}"><div class="chips">${['Me', 'The broker', 'Security', 'Someone else'].map(x => `<button class="chip ${a.keys === x ? 'on' : ''}" data-on="${on(() => { a.keys = x; a.bad = 0; oSave(); })}">${x}</button>`).join('')}</div>${a.bad && !a.keys ? '<p class="need">Choose one</p>' : ''}</div>${a.keys === 'Someone else' ? field('kn', 'Their name', a.kn, { bad: a.bad, need: 'Type the name and number' }) + field('kp', 'Their number', a.kp, { type: 'tel', pre: '+91' }) : ''}`, read: a => { if (a.keys === 'Someone else') { a.kn = val('kn'); a.kp = val('kp'); } }, ok: a => !!a.keys && (a.keys !== 'Someone else' || ((a.kn || '').length > 1 && (a.kp || '').replace(/\D/g, '').length === 10)) },
];
function oSave() { if (OH) store.set('owner-house', OH); redraw(); }
let OH = null;
function ownerHome() {
  const inv = INV;
  return `<div class="screen"><div class="hd"><div class="hdr" style="justify-content:center"><span class="brand">TrustKeeper</span></div></div><div class="bd">
    <div class="photo" style="height:180px">${HOUSE}</div>
    <div class="big">Add your house</div>
    <p class="muted" style="font-size:16px;line-height:24px">${esc(inv.bn || 'Your broker')} asked you to add ${inv.h ? '<b>' + esc(inv.h) + '</b>' : 'your house'} on TrustKeeper. It takes about 5 minutes. One question at a time.</p>
    <div class="steps"><b style="color:var(--h)">What we ask</b>${[['About the house', 'Address, rooms, size, furnishing.'], ['Rent and who can rent', 'Rent, deposit, tenants, pets.'], ['Visits and photos', 'When people can visit.'], ['Papers', 'Aadhaar, old agreement, bank, keys.']].map((s, i) => `<div class="st"><span class="dot">${i + 1}</span><div><b>${s[0]}</b><small>${s[1]}</small></div></div>`).join('')}</div>
    <div class="note">${ic('lock')}<span>Your address, number and papers are only for your broker and TrustKeeper. Tenants never see them.</span></div>
    <button class="btn" data-on="${on(() => { const u = store.get('owner-user'); if (u) go(ownerQ); else go(signup('owner', () => replace(ownerQ))); })}">Start</button>
  </div></div>`;
}
function ownerQ() {
  OH = O(); const a = OH.a; const qi = OH.q;
  if (qi >= QS.length) return ownerDone();
  const q = QS[qi];
  if (q.k === 'me' && a.owners < 1) a.owners = 1;
  store.set('owner-house', OH);
  const sub = typeof q.s === 'function' ? q.s(a) : q.s;
  const last = qi === QS.length - 1;
  return screen(q.t, sub || '', `${q.v(a)}
    <button class="btn" data-on="${on(() => ownerNext(false))}">${last ? 'Send to broker' : 'Next'}</button>
    ${q.skip ? `<button class="btn ghost" data-on="${on(() => ownerNext(true))}">Skip for now</button>` : ''}`,
    { top: `<div class="muted" style="margin-bottom:8px">Question ${qi + 1} of ${QS.length}</div><div class="prog" style="margin:0 0 12px"><i style="width:${Math.round(qi / QS.length * 100)}%"></i></div>` });
}
function ownerNext(skipped) {
  const h = O(); const a = h.a; const q = QS[h.q];
  if (q.read) q.read(a);
  if (!skipped && q.ok && !q.ok(a)) { a.bad = 1; store.set('owner-house', h); return redraw(); }
  a.bad = 0; h.q++; store.set('owner-house', h); go(ownerQ);
}
// Back inside the questions goes one question back.
const _back = back;
back = function () { const top = stack[stack.length - 1]; if (top && top[0] === ownerQ) { const h = O(); if (h.q > 0) { h.q--; store.set('owner-house', h); } } _back(); };
function ownerDone() {
  const u = store.get('owner-user', {});
  return screen('All done', '', `<div class="ok">${ic('check', '#146C3E').replace('class="i"', 'class="i" style="width:40px;height:40px;stroke:#146C3E"')}</div>
    <div class="center"><div class="big">Thank you, ${esc((u.name || '').split(' ')[0])}!</div><p class="muted">${esc(INV.bn || 'Your broker')} can now share your house with tenants. We will message you on WhatsApp when someone books a visit.</p></div>
    <div class="note">${ic('shield')}<span>When a tenant blocks your house, we ask for a few more details to make the rent agreement. You sign it online.</span></div>
    <button class="btn out" data-on="${on(() => { const h = O(); h.q = 0; store.set('owner-house', h); stack = [stack[0]]; go(ownerQ); })}">Check my answers</button>`, { noBack: true });
}

/* ================= DEMO HOME (no link) ================= */
function demoHome() {
  return screen('TrustKeeper links', 'What tenants and owners open from WhatsApp.', `
    <div class="card" style="padding:18px"><b style="color:var(--h);font-size:17px">Tenant</b><p class="muted">Opens a property the broker shared. No sign-up until they book a visit.</p><a class="btn" style="text-decoration:none;margin-top:12px" href="#sample">Open a sample property</a></div>
    <div class="card" style="padding:18px;margin-top:16px"><b style="color:var(--h);font-size:17px">House owner</b><p class="muted">Opens the broker's invite, signs up with phone or email, then adds the house one question at a time.</p><a class="btn out" style="text-decoration:none;margin-top:12px" href="#owner">Open an owner invite</a></div>
    <button class="btn ghost" data-on="${on(() => { try { Object.keys(localStorage).filter(k => k.startsWith('tk-')).forEach(k => localStorage.removeItem(k)); } catch {} redraw(); })}">Reset demo</button>`, { noBack: true });
}

function start() {
  clearInterval(cancelTimer); handlers = {}; stack = [];
  const r = readHash();
  if (r.kind === 'tenant') { P = r.p; stack = [[propertyView, []]]; }
  else if (r.kind === 'owner') { INV = r.inv; stack = [[ownerHome, []]]; }
  else stack = [[demoHome, []]];
  draw(false);
}
window.addEventListener('hashchange', start);
start();
</script>
</body>
</html>
