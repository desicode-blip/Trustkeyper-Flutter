<!DOCTYPE html>
<html>
<head>
  <!--
    If you are serving your web app in a path other than the root, change the
    href value below to reflect the base path you are serving from.

    The path provided below has to start and end with a slash "/" in order for
    it to work correctly.

    For more details:
    * https://developer.mozilla.org/en-US/docs/Web/HTML/Element/base

    This is a placeholder for base href that will be replaced by the value of
    the `--base-href` argument provided to `flutter build`.
  -->
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="TrustKeyper Flutter application for brokers, owners, tenants, and administrators.">
  <meta name="theme-color" content="#F6F9FD">

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="TrustKeyper">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>TrustKeyper</title>
  <link rel="manifest" href="manifest.json">
  <style>
    html, body {
      background: #f6f9fd;
      height: 100%;
      margin: 0;
    }

    body {
      color: #172231;
      font-family: Arial, Helvetica, sans-serif;
    }

    #trustkeyper-bootstrap {
      align-items: center;
      display: flex;
      inset: 0;
      justify-content: center;
      padding: 24px;
      position: fixed;
    }

    .trustkeyper-bootstrap-card {
      align-items: center;
      background: #fff;
      border: 1px solid #dce2e9;
      border-radius: 18px;
      box-shadow: 0 14px 32px rgba(14, 36, 66, 0.07);
      display: flex;
      flex-direction: column;
      max-width: 420px;
      padding: 32px;
      text-align: center;
      width: 100%;
    }

    .trustkeyper-bootstrap-logo {
      height: 42px;
      margin-bottom: 24px;
      object-fit: contain;
      width: auto;
    }

    .trustkeyper-bootstrap-spinner {
      animation: trustkeyper-spin 0.8s linear infinite;
      border: 3px solid #eaf0ff;
      border-radius: 50%;
      border-top-color: #3160ff;
      height: 28px;
      margin-bottom: 18px;
      width: 28px;
    }

    #trustkeyper-bootstrap-title {
      font-size: 20px;
      font-weight: 700;
      margin: 0 0 8px;
    }

    #trustkeyper-bootstrap-message {
      color: #5e7087;
      font-size: 14px;
      line-height: 1.5;
      margin: 0;
    }

    #trustkeyper-bootstrap-retry {
      background: #3160ff;
      border: 0;
      border-radius: 9px;
      color: #fff;
      cursor: pointer;
      display: none;
      font-size: 14px;
      font-weight: 700;
      margin-top: 20px;
      padding: 12px 22px;
    }

    @keyframes trustkeyper-spin {
      to { transform: rotate(360deg); }
    }
  </style>
</head>
<body>
  <div id="trustkeyper-bootstrap" role="status" aria-live="polite">
    <div class="trustkeyper-bootstrap-card">
      <img
        class="trustkeyper-bootstrap-logo"
        src="assets/assets/images/trustkeyper-logo.png"
        alt="TrustKeyper"
      >
      <div class="trustkeyper-bootstrap-spinner" aria-hidden="true"></div>
      <p id="trustkeyper-bootstrap-title">Opening TrustKeyper</p>
      <p id="trustkeyper-bootstrap-message">Loading your secure workspace…</p>
      <button
        id="trustkeyper-bootstrap-retry"
        type="button"
        onclick="window.location.reload()"
      >
        Try again
      </button>
    </div>
  </div>
  <noscript>TrustKeyper requires JavaScript to run.</noscript>
  <script src="firebase-startup.js"></script>
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
